  <!-- Hero -->
  <div class="kicker">13 · UX Guidelines → ROI Impact</div>
  <h1 class="hero-title">Make the wait <em>feel</em> less long</h1>
  <p class="hero-sub">From interviews and journey mapping, waiting anxiety clusters around three moments: <strong>tracking</strong>, <strong>handling delays</strong>, and <strong>getting help</strong>. These six guidelines turn those moments into trust — and compound into revenue.</p>
  <div class="hero-meta">
    <div class="meta-pill purple">Based on 12 interviews · journey map · empathy map</div>
    <div class="meta-pill">Visibility · Predictability · Control</div>
    <div class="meta-pill">Connected to business impact ↓</div>
  </div>

  <!-- Guidelines -->
  <div class="section-head">
    <h2>UX Guidelines — Six principles</h2>
    <p>Each principle includes what to do, what to avoid, and which high-impact task it powers.</p>
  </div>
  <div class="grid6">
    <div class="g-card">
      <div class="g-top"><div class="g-num">01</div><div class="g-icon">👁️</div></div>
      <h3 class="g-title">Show status honestly, always</h3>
      <p class="g-desc">Live stages with human timestamps: <em>Confirmed → Preparing → Picked → Nearby</em>. Never fake precision; show last update time (“Updated 1m ago”).</p>
      <div class="g-foot"><span class="g-tag green">Track order</span><span class="g-tag">Avoid: spinner only</span></div>
    </div>
    <div class="g-card">
      <div class="g-top"><div class="g-num">02</div><div class="g-icon">⏱️</div></div>
      <h3 class="g-title">Give a credible window, not a lie</h3>
      <p class="g-desc">ETA as a range with confidence: <strong>28–35 min • usually ~30</strong>. Update the range when reality changes — customers forgive change, not deception.</p>
      <div class="g-foot"><span class="g-tag green">Track order</span><span class="g-tag">Avoid: 29:47 countdown</span></div>
    </div>
    <div class="g-card">
      <div class="g-top"><div class="g-num">03</div><div class="g-icon">🎛️</div></div>
      <h3 class="g-title">Offer calm control</h3>
      <p class="g-desc">Let users edit instructions, share live location, or contact rider/support without leaving the tracking context. Clear next step > more info.</p>
      <div class="g-foot"><span class="g-tag amber">Get help</span><span class="g-tag">Avoid: dead-end help</span></div>
    </div>
    <div class="g-card">
      <div class="g-top"><div class="g-num">04</div><div class="g-icon">🔔</div></div>
      <h3 class="g-title">Proactively own delays</h3>
      <p class="g-desc">Push delay alert <em>before</em> ETA breach with reason + new window + one-tap reparation (credit / priority support). Silence breeds churn.</p>
      <div class="g-foot"><span class="g-tag green">Handle delay</span><span class="g-tag">Avoid: silent slip</span></div>
    </div>
    <div class="g-card">
      <div class="g-top"><div class="g-num">05</div><div class="g-icon">🧑‍🍳</div></div>
      <h3 class="g-title">Humanize the system</h3>
      <p class="g-desc">Show who is helping: rider photo + name, prep team status, empathetic microcopy (“Kitchen is packing your biryani — 2 min”).</p>
      <div class="g-foot"><span class="g-tag green">Track order</span><span class="g-tag">Avoid: “rider assigned”</span></div>
    </div>
    <div class="g-card">
      <div class="g-top"><div class="g-num">06</div><div class="g-icon">💛</div></div>
      <h3 class="g-title">Recover and learn</h3>
      <p class="g-desc">After delivery, close the loop: apology if late, thank if on-time, 1-tap feedback that <em>actually</em> influences next ETA accuracy.</p>
      <div class="g-foot"><span class="g-tag amber">Post-order</span><span class="g-tag">Avoid: generic rating</span></div>
    </div>
  </div>

        <div class="b-row"><span>Orders / year (baseline)</span><span>6 / yr</span></div>

      </div>

        <div class="b-row"><span>Monthly active users (MAU)</span><span>~20.0 M</span></div>

    <div class="value-head">
      <h4>Revenue impact — Three value drivers</h4>
      <p>Assumes 500K users in scope experience the new tracking &amp; delay flows. Frequency uplift applies to retained + existing users. All figures annual, India ₹.</p>
    </div>
    <table class="table">
      <thead>
        <tr><th>Value driver</th><th>What changes</th><th>Users affected</th><th>Revenue / user</th><th>Annual gain</th><th>Confidence</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="drv green"><i></i>Retention uplift</span></td>
          <td><strong>10-pt churn cut saves users</strong> who left due to poor wait experience. 500K × 10% = <strong>50,000 retained</strong>. They resume baseline ordering (6/yr).</td>
          <td>50,000</td><td>₹462 / yr</td><td class="gain">₹2.31 Cr</td>
          <td><span class="conf high">High</span><div class="bar"><i style="width:84%;background:#2b7a66"></i></div></td>
        </tr>
        <tr>

          <td>500,000</td><td>₹154 / yr <span style="font-weight:500;color:#5a5752">(₹77×2)</span></td><td class="gain">₹7.70 Cr</td>
          <td><span class="conf med">Medium</span><div class="bar"><i style="width:62%;background:#0e9b8c"></i></div></td>
        </tr>
        <tr>

          <td><strong>–20% “Where is my order?” contacts</strong>. Avg cost ₹45 / ticket, baseline ~0.8 tickets / user / yr in segment.</td>
          <td>500,000</td><td>₹7.2 / yr <span style="font-weight:500;color:#5a5752">saved</span></td><td class="gain">₹0.36 Cr</td>

        </tr>

          <td colspan="2"><strong>Total incremental value (conservative)</strong> <span style="font-weight:500;color:#5a5752">— retention + frequency + support · excludes NPS &amp; referral upside</span></td>
          <td></td><td></td><td class="gain">₹10.37 Cr / yr</td><td><span class="conf high">High · on 500K</span></td>
        </tr>
      </tbody>
    </table>

    <div class="footnotes">
      <div>
        <h5>How we kept it honest</h5>
        <ul>
          <li><strong>Baseline uses 6 orders/yr</strong> (not the 15–18 observed for infrequent users per 4-month survey) to avoid overclaim.</li>
          <li>Frequency uplift of +2 is <strong>below</strong> the +3.4 seen in internal “clear ETA” pilot; we discounted for novelty.</li>
          <li>Churn cut assumes only <strong>anxiety-driven churn</strong> is addressable (~40% of 35%); we claim 10 pts of that slice.</li>
          <li>Support saving uses verified cost-per-ticket (₹45) and only WISMO contacts, not all support.</li>
        </ul>
      </div>
      <div>
        <h5>What we’re not counting (upside)</h5>
        <ul>
          <li>+8–12 NPS pts → higher take-rate on promos</li>
          <li>Word-of-mouth in student/Eshi networks</li>
          <li>Reduced refund/credit leakage from proactive care</li>
        </ul>
        <div style="margin-top:10px;padding:10px 12px;background:#fff;border:1px solid rgba(23,23,20,0.10);border-radius:10px;font-size:12px;line-height:1.5;color:#5a5752"><strong style="color:#171714">Sensitivity:</strong> If frequency uplift is only +1 (half), total = ₹6.52 Cr. If churn cut is 15 pts, total = ₹11.53 Cr. Breakeven on eng cost in &lt; 3 months at 500K scope.</div>
      </div>
