  .pnav-sep { flex:none; width:1px; height:28px; background:var(--pn-line); }

    display:flex; align-items:center; gap:8px; flex:0 1 230px; min-width:0; max-width:230px;
    padding:7px 10px; color:var(--pn-ink); background:#fff; border:1px solid var(--pn-line); border-radius:999px;
    font-size:12px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;

  .pnav-screen-sep { flex:none; color:rgba(27,57,20,.35); }
  .pnav-screen-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* links + dropdowns */
  .pnav-links { display:flex; align-items:center; gap:2px; }
  .pnav-links > a, .pnav-dd-btn {
    display:inline-flex; align-items:center; gap:6px; padding:9px 12px;
    color:rgba(27,57,20,.72); background:transparent; border:0; border-radius:999px;
    font-size:14px; font-weight:600; text-decoration:none; line-height:1;
    transition:color .2s ease, background .2s ease;
  }
  .pnav-links > a:hover, .pnav-links > a:focus-visible, .pnav-dd-btn:hover, .pnav-dd-btn:focus-visible, .pnav-dd.is-open > .pnav-dd-btn { color:var(--pn-ink); background:rgba(27,57,20,.07); }
  .pnav-dd-btn svg { width:10px; height:10px; transition:transform .2s ease; }
  .pnav-dd.is-open > .pnav-dd-btn svg { transform:rotate(180deg); }
  .pnav-links > a.pnav-cta { margin-left:6px; padding:11px 18px; color:var(--pn-lime); background:var(--pn-ink); font-size:13px; font-weight:700; }
  .pnav-links > a.pnav-cta:hover, .pnav-links > a.pnav-cta:focus-visible { color:var(--pn-ink); background:var(--pn-lime); }
  .pnav-dd { position:relative; }
  .pnav-dd-menu {
    position:absolute; top:calc(100% + 12px); right:0; width:320px; padding:8px;
    background:#fff; border:1px solid var(--pn-line); border-radius:18px;
    box-shadow:0 22px 50px rgba(27,57,20,.16);
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s ease;
  }
  .pnav-dd.is-open > .pnav-dd-menu { opacity:1; visibility:visible; transform:none; }
  .pnav-dd-label { margin:0; padding:8px 10px 8px; color:rgba(27,57,20,.55); font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; line-height:1; }
  .pnav-proj { display:flex; align-items:center; gap:12px; padding:10px; color:var(--pn-ink); text-decoration:none; border-radius:12px; transition:background .2s ease; }
  .pnav-proj:hover, .pnav-proj:focus-visible, .pnav-proj[aria-current] { background:var(--pn-mint); }
  .pnav-proj-n { flex:none; display:grid; place-items:center; width:30px; height:30px; color:rgba(27,57,20,.7); background:#fff; border:1px solid var(--pn-line); border-radius:50%; font-size:11px; font-weight:800; }
  .pnav-proj[aria-current] .pnav-proj-n { color:var(--pn-lime); background:var(--pn-ink); border-color:var(--pn-ink); }

  .pnav-here { margin-left:auto; color:var(--pn-green); font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
  .pnav-burger { display:none; flex:none; flex-direction:column; align-items:center; justify-content:center; gap:4px; width:40px; height:40px; padding:0; background:#fff; border:1px solid var(--pn-line); border-radius:50%; }

  .pnav.is-menu-open .pnav-burger span:nth-child(1) { transform:translateY(5.6px) rotate(45deg); }
  .pnav.is-menu-open .pnav-burger span:nth-child(2) { opacity:0; }
  .pnav.is-menu-open .pnav-burger span:nth-child(3) { transform:translateY(-5.6px) rotate(-45deg); }
  .pnav :focus-visible { outline:2px solid var(--pn-green); outline-offset:2px; }

  /* keep slide anchors clear of the sticky header on desktop */
  .slide { scroll-margin-top:var(--pnav-h); }

  @media (max-width: 1180px) {
    .pnav-burger { display:flex; }

      display:none; position:absolute; top:100%; left:0; right:0;

  /* ================= SLIDE RAIL (scroll-driven slide strip) ================= */
  :root { --sld-rail-h:46px; }
  .sld-rail {
    position:sticky; top:var(--pnav-h); z-index:29; height:var(--sld-rail-h);
    display:flex; align-items:center;
    background:rgba(239,255,221,.93);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--pn-line);
  }
  .sld-rail-in {
    display:flex; align-items:center; gap:6px; width:100%; height:100%;
    padding:0 clamp(14px, 3vw, 40px);
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -ms-overflow-style:none;
    overscroll-behavior-x:contain; scroll-behavior:smooth;
  }
  .sld-rail-in::-webkit-scrollbar { display:none; }
  .sld-rail a {
    flex:none; display:inline-flex; align-items:center; gap:6px;
    padding:7px 13px; border:1px solid var(--pn-line); border-radius:999px;
    background:#fff; color:rgba(27,57,20,.62); text-decoration:none; white-space:nowrap;
    font:600 12px/1 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .sld-rail a b { font-weight:800; color:var(--pn-ink); }
  .sld-rail a:hover, .sld-rail a:focus-visible { color:var(--pn-ink); border-color:var(--pn-ink); }
  .sld-rail a.is-active, .sld-rail a.active { background:var(--pn-ink); border-color:var(--pn-ink); color:rgba(239,255,221,.85); }
  .sld-rail a.is-active b, .sld-rail a.active b { color:var(--pn-lime); }
  .sld-rail a:focus-visible { outline:2px solid var(--pn-green); outline-offset:2px; }
  .slide { scroll-margin-top:calc(var(--pnav-h) + var(--sld-rail-h) + 8px); }
  @media (max-width:1024px) {
    /* the rail shares the screen with the full-height deck viewer */
    .deck { height:calc(100vh - var(--pnav-h) - var(--sld-rail-h)); height:calc(100svh - var(--pnav-h) - var(--sld-rail-h)); }
    .slide { height:calc(100vh - var(--pnav-h) - var(--sld-rail-h)); height:calc(100svh - var(--pnav-h) - var(--sld-rail-h));
             contain-intrinsic-size:auto calc(100vh - var(--pnav-h) - var(--sld-rail-h)); scroll-margin-top:0; }
  }

  }
  @media print { .sld-rail { display:none; } }

  /* ===== back to top — unified circular arrow (matches MBG + StrategicUX) ===== */
  .back-top{

<button class="back-top" id="backTop" type="button" aria-label="Back to top"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4 12 6-6 6 6M10 7v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<script>
/* Back-to-top — unified across MBG / StrategicUX / MedicalAdher */
(() => {
  const btn = document.getElementById('backTop');
  const deck = document.getElementById('deck');
  if (!btn) return;
  function sync(){
    const winY = window.scrollY || document.documentElement.scrollTop || 0;
    const deckY = (deck && deck.scrollHeight > deck.clientHeight) ? deck.scrollTop : 0;
    const y = Math.max(winY, deckY);
    const threshold = Math.min(520, window.innerHeight * 0.6);
    const show = y > threshold;
    btn.classList.toggle('is-visible', show);
    btn.classList.toggle('show', show);
  }
  function goTop(){
    if (deck && deck.scrollTop > 0) deck.scrollTo({top:0, behavior:'smooth'});
    window.scrollTo({top:0, behavior:'smooth'});
  }
  btn.addEventListener('click', goTop);
  window.addEventListener('scroll', sync, {passive:true});
  if (deck) deck.addEventListener('scroll', sync, {passive:true});
  window.addEventListener('resize', sync, {passive:true});
  sync();
})();
</script>

<script>
/* Project header navigation: back link, projects menu, mobile menu (independent of the page's own scripts) */
(() => {
  const nav = document.querySelector('[data-pnav]');
  if (!nav) return;
  const burger = nav.querySelector('.pnav-burger');
  const dds = [...nav.querySelectorAll('.pnav-dd')];
  const closeDDs = (except) => dds.forEach((d) => {
    if (d === except) return;
    d.classList.remove('is-open');
    const b = d.querySelector('.pnav-dd-btn');
    if (b) b.setAttribute('aria-expanded', 'false');
  });
  const setMenu = (open) => {
    nav.classList.toggle('is-menu-open', open);
    if (burger) {
      burger.setAttribute('aria-expanded', String(open));
      burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    }
  };
  if (burger) burger.addEventListener('click', (e) => {
    e.stopPropagation();
    closeDDs();
    setMenu(!nav.classList.contains('is-menu-open'));
  });
  dds.forEach((d) => {
    const b = d.querySelector('.pnav-dd-btn');
    if (!b) return;
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !d.classList.contains('is-open');
      closeDDs(d);
      d.classList.toggle('is-open', open);
      b.setAttribute('aria-expanded', String(open));
    });
  });
  nav.addEventListener('click', (e) => {
    if (e.target.closest('a')) { closeDDs(); setMenu(false); }
  });
  document.addEventListener('click', (e) => {
    if (!nav.contains(e.target)) { closeDDs(); setMenu(false); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeDDs(); setMenu(false); }
  });
  window.addEventListener('resize', () => setMenu(false), { passive: true });
})();
</script>

<script>
/* =====================================================================
   Slide rail — scroll-driven slide indicator
   Shared by MBG / Medical Adherence / Food Delivery case studies.

   Why this exists: the old version asked an IntersectionObserver for
   "the slide that is >= 50% visible". A slide that is taller than twice
   the viewport can never reach that, and a fast trackpad flick carries a
   slide straight past the threshold between two callbacks — so the
   indicator skipped slides, fired out of order, and then froze.

   This version computes the current slide from geometry on every scroll
   frame: the slide that owns a reference line just under the sticky bar.
   It is height-agnostic and speed-agnostic, so it cannot get stuck.
   It also keeps the active pill scrolled into view inside the strip.
   ===================================================================== */
(() => {
  'use strict';

  /* ---- 1. find the slides ------------------------------------------ */
  const candidates = ['.slide-sec', '.deck > .slide', 'figure.slide[data-slide]', '.slide[data-slide]'];
  let slides = [];
  for (const sel of candidates) {
    const found = Array.prototype.slice.call(document.querySelectorAll(sel));
    if (found.length > 1) { slides = found; break; }
  }
  if (slides.length < 2) return;

  const pad2 = (n) => String(n).padStart(2, '0');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const motion = reduced ? 'auto' : 'smooth';

  /* ---- 2. the strip: reuse an authored one, else build it ---------- */
  const info = (el, i) => {
    // Medical Adherence and Food Delivery author the name on the slide itself
    // numbered by position: Food Delivery's authored data-slide skips 24
    if (el.dataset.screenTitle) {
      return { num: pad2(i + 1), name: el.dataset.screenTitle.trim() };
    }
    // MBG stamps "01 — Cover" on the artwork
    const chip = el.querySelector('.slide-num');
    if (chip) {
      const bits = chip.textContent.split('\u2014');
      return { num: (bits[0] || pad2(i + 1)).trim(), name: (bits[1] || '').trim() };
    }
    // Food Delivery labels the frame: "Cover: Food Delivery — Waiting Anxiety"
    const frame = el.querySelector('[aria-label]');
    const raw = frame ? (frame.getAttribute('aria-label') || '') : '';
    const name = raw.indexOf(':') > 0 && raw.indexOf(':') < 26 ? raw.slice(raw.indexOf(':') + 1).trim() : '';
    const n = Number(el.dataset.slide);
    return { num: pad2(Number.isFinite(n) && n > 0 ? n : i + 1), name };
  };

  let strip = document.querySelector('.toc .wrap');
  let links;

  if (strip && strip.querySelectorAll('a').length === slides.length) {
    links = Array.prototype.slice.call(strip.querySelectorAll('a'));
  } else {
    const rail = document.createElement('nav');
    rail.className = 'sld-rail';
    rail.setAttribute('aria-label', 'Slide navigation');
    strip = document.createElement('div');
    strip.className = 'sld-rail-in';
    rail.appendChild(strip);

    slides.forEach((el, i) => {
      const meta = info(el, i);
      const a = document.createElement('a');
      a.href = '#' + el.id;
      a.dataset.target = el.id;
      const b = document.createElement('b');
      b.textContent = meta.num;
      a.appendChild(b);
      if (meta.name) {
        const span = document.createElement('span');
        span.textContent = meta.name;
        a.appendChild(span);
        a.title = meta.num + ' \u2014 ' + meta.name;
        a.setAttribute('aria-label', 'Go to slide ' + meta.num + ': ' + meta.name);
      } else {
        a.setAttribute('aria-label', 'Go to slide ' + meta.num);
      }
      strip.appendChild(a);
    });

    links = Array.prototype.slice.call(strip.children);
    const anchorEl = document.querySelector('.progress-wrap') || document.querySelector('[data-pnav]');
    if (anchorEl && anchorEl.parentNode) anchorEl.insertAdjacentElement('afterend', rail);
    else document.body.insertBefore(rail, document.body.firstChild);
  }

  /* ---- 3. keep the active pill visible inside the strip ------------ */
  function reveal(link) {
    if (!link) return;
    const sr = strip.getBoundingClientRect();
    const lr = link.getBoundingClientRect();
    const pad = 14;
    let dx = 0;
    if (lr.left < sr.left + pad) dx = lr.left - sr.left - pad;
    else if (lr.right > sr.right - pad) dx = lr.right - sr.right + pad;
    if (Math.abs(dx) < 1) return;
    if (typeof strip.scrollBy === 'function') strip.scrollBy({ left: dx, behavior: motion });
    else strip.scrollLeft += dx;
  }

  /* ---- 4. which slide owns the reference line right now? ----------- */
  function currentIndex() {
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const sr = strip.getBoundingClientRect();
    if (!sr.height) return 0;                      // layout not ready yet
    // at the very end the last slide can be too short to own the reference
    // line, so once its foot is on screen the last slide is the current one
    if (slides[slides.length - 1].getBoundingClientRect().bottom <= vh + 1) return slides.length - 1;
    const top = Math.min(Math.max(sr.bottom, 0), vh);
    const line = top + (vh - top) * 0.34;          // a third of the way down
    for (let i = 0; i < slides.length; i++) {
      if (slides[i].getBoundingClientRect().bottom > line) return i;
    }
    return slides.length - 1;                      // scrolled past everything
  }

  /* ---- 5. publish the change --------------------------------------- */
  let current = -1;
  function setActive(i, force) {
    if (i < 0) i = 0;
    if (i > slides.length - 1) i = slides.length - 1;
    if (i === current) { if (force) reveal(links[i]); return; }
    current = i;
    const el = slides[i];
    links.forEach((a, k) => {
      const on = k === i;
      a.classList.toggle('is-active', on);
      a.classList.toggle('active', on);        // MBG styles `.toc a.active`
      if (on) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
    reveal(links[i]);
    window.dispatchEvent(new CustomEvent('slide-rail:change', { detail: { index: i, id: el.id, slide: el } }));
  }

  let queued = false;
  function onScroll() {
    if (queued) return;
    queued = true;
    window.requestAnimationFrame(() => { queued = false; setActive(currentIndex(), true); });
  }

  // capture: true also catches scrolls from an inner container
  // (the Medical deck becomes its own scroller on phones)
  window.addEventListener('scroll', onScroll, { capture: true, passive: true });
  window.addEventListener('resize', onScroll, { passive: true });

  /* ---- 6. jumping --------------------------------------------------- */
  strip.addEventListener('click', (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    const i = links.indexOf(a);
    if (i < 0) return;
    e.preventDefault();
    const el = slides[i];
    el.scrollIntoView({ behavior: motion, block: 'start' });
    setActive(i, true);
    if (history.replaceState) history.replaceState(null, '', '#' + el.id);
  });

  strip.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = links.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const n = e.key === 'ArrowRight' ? Math.min(links.length - 1, i + 1) : Math.max(0, i - 1);
    links[n].focus();
    reveal(links[n]);
  });

  /* ---- 7. first paint ---------------------------------------------- */
  function firstPaint() {
    const hashIdx = slides.findIndex((s) => '#' + s.id === window.location.hash);
    setActive(hashIdx >= 0 ? hashIdx : currentIndex(), true);
  }
  // a frame out, so the browser has laid the slides out before we measure
  window.requestAnimationFrame(firstPaint);
  // ...and again once webfonts land, since they can shift the strip
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(firstPaint).catch(() => {});
  window.setTimeout(firstPaint, 400);
})();

</script>
